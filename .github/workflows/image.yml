name: Verify and publish studio
on:
  workflow_dispatch:
  push:
    branches: [main, codex/hosted-platform]
  pull_request:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint && npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/paolodit/phone-in-studio:${{ github.sha }}
          cache-from: type=gha,scope=studio
          cache-to: type=gha,mode=max,scope=studio
      - name: Record immutable release
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Studio image ghcr.io/paolodit/phone-in-studio@%s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
